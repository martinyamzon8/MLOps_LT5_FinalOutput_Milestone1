[project]
name = "mlops-lt5-milestone1"
version = "0.1.0"
description = "PAL passenger market segmentation - Milestone 1 data pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "pandera==0.20.4",
    "openpyxl==3.1.5",
    "pyarrow==18.1.0",
    "scikit-learn>=1.9.0",
    "mlflow>=3.15.0",
    "pytest>=8.3.3",
    "ruff>=0.7.4",
    "evidently>=0.7.21",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "joblib>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.4",
    "pre-commit==4.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:numpy.*",
    "ignore::DeprecationWarning:litestar.*",
    "ignore:.*LitestarDeprecationWarning.*",
]
